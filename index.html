<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Idle Clicker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            touch-action: manipulation; /* Verhindert störendes Zoom-Verhalten beim schnellen Tippen auf dem Handy */
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .stats-container {
            font-size: 1.2rem;
            margin: 20px 0;
            text-align: center;
            background-color: #161b22;
            padding: 15px 30px;
            border-radius: 6px;
            border: 1px solid #30363d;
            width: 80%;
            max-width: 440px;
        }

        .commit-count {
            font-size: 2rem;
            font-weight: bold;
            color: #3fb950;
        }

        #commit-button {
            width: 120px;
            height: 120px;
            background-color: #216e39;
            border: 3px solid #30a14e;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.05s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent; /* Entfernt den blauen Klick-Kasten auf Mobilgeräten */
        }

        #commit-button:hover {
            background-color: #30a14e;
        }

        #commit-button:active {
            transform: scale(0.92);
            background-color: #3fb950;
        }

        .shop-container {
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161b22;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        .shop-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #f0f6fc;
        }

        .shop-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .buy-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .buy-btn:hover:not(:disabled) {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Reset-Button für den Spielstand */
        .reset-btn {
            margin-top: 40px;
            background-color: transparent;
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .reset-btn:hover {
            background-color: rgba(248, 81, 73, 0.1);
        }
    </style>
</head>
<body>

    <h1>Git Commit Clicker</h1>
    <p style="color: #8b949e; margin-top: 0;">Klicke das Quadrat für maximale Contributions!</p>

    <button id="commit-button" title="Klicken zum Committen!"></button>

    <div class="stats-container">
        <div>Commits: <span id="commits" class="commit-count">0</span></div>
        <div style="font-size: 0.9rem; color: #8b949e; margin-top: 5px;">
            Produktion: <span id="cps">0</span> Commits/Sekunde
        </div>
    </div>

    <div class="shop-container">
        <h2>Upgrades & Automation</h2>
        
        <div class="shop-item">
            <div class="shop-info">
                <h3>Junior Developer (<span id="count-junior">0</span>)</h3>
                <p>Generiert +1 Commit/Sek</p>
            </div>
            <button class="buy-btn" id="buy-junior" onclick="buyUpgrade('junior')">
                Kaufen (<span id="cost-junior">15</span> C)
            </button>
        </div>

        <div class="shop-item">
            <div class="shop-info">
                <h3>AI Copilot (<span id="count-copilot">0</span>)</h3>
                <p>Generiert +8 Commits/Sek</p>
            </div>
            <button class="buy-btn" id="buy-copilot" onclick="buyUpgrade('copilot')">
                Kaufen (<span id="cost-copilot">100</span> C)
            </button>
        </div>

        <div class="shop-item">
            <div class="shop-info">
                <h3>Senior Architect (<span id="count-senior">0</span>)</h3>
                <p>Generiert +50 Commits/Sek</p>
            </div>
            <button class="buy-btn" id="buy-senior" onclick="buyUpgrade('senior')">
                Kaufen (<span id="cost-senior">1100</span> C)
            </button>
        </div>
    </div>

    <button class="reset-btn" onclick="resetGame()">Spielstand zurücksetzen</button>

    <script>
        // Standard-Spielstand
        const defaultData = {
            commits: 0,
            cps: 0,
            upgrades: {
                junior: { count: 0, cost: 15, cpsGain: 1 },
                copilot: { count: 0, cost: 100, cpsGain: 8 },
                senior: { count: 0, cost: 1100, cpsGain: 50 }
            }
        };

        let gameData = {};

        // LÄDT DEN SPIELSTAND AUS DEM SPEICHER
        function loadGame() {
            const savedData = localStorage.getItem('gitClickerSave');
            if (savedData) {
                try {
                    gameData = JSON.parse(savedData);
                    // Falls Updates am Spiel gemacht wurden, fülle fehlende Felder auf
                    for (let key in defaultData.upgrades) {
                        if (!gameData.upgrades[key]) {
                            gameData.upgrades[key] = { ...defaultData.upgrades[key] };
                        }
                    }
                } catch(e) {
                    gameData = JSON.parse(JSON.stringify(defaultData));
                }
            } else {
                gameData = JSON.parse(JSON.stringify(defaultData));
            }
            recalculateCPS();
        }

        // SPEICHERT DEN SPIELSTAND
        function saveGame() {
            localStorage.setItem('gitClickerSave', JSON.stringify(gameData));
        }

        // ZURÜCKSETZEN
        function resetGame() {
            if (confirm("Möchtest du deinen Spielstand wirklich komplett löschen?")) {
                localStorage.removeItem('gitClickerSave');
                gameData = JSON.parse(JSON.stringify(defaultData));
                recalculateCPS();
                updateDisplay();
            }
        }

        const commitBtn = document.getElementById('commit-button');
        const commitsDisplay = document.getElementById('commits');
        const cpsDisplay = document.getElementById('cps');

        commitBtn.addEventListener('click', () => {
            gameData.commits += 1;
            updateDisplay();
        });

        function buyUpgrade(type) {
            let upgrade = gameData.upgrades[type];
            if (gameData.commits >= upgrade.cost) {
                gameData.commits -= upgrade.cost;
                upgrade.count++;
                upgrade.cost = Math.ceil(upgrade.cost * 1.15);
                recalculateCPS();
                updateDisplay();
                saveGame(); // Direkt nach dem Kauf speichern
            }
        }

        function recalculateCPS() {
            let totalCPS = 0;
            for (let key in gameData.upgrades) {
                let up = gameData.upgrades[key];
                totalCPS += up.count * up.cpsGain;
            }
            gameData.cps = totalCPS;
        }

        function updateDisplay() {
            commitsDisplay.innerText = Math.floor(gameData.commits);
            cpsDisplay.innerText = gameData.cps;

            for (let key in gameData.upgrades) {
                let up = gameData.upgrades[key];
                const btn = document.getElementById(`buy-${key}`);
                const costSpan = document.getElementById(`cost-${key}`);
                const countSpan = document.getElementById(`count-${key}`);
                
                costSpan.innerText = up.cost;
                countSpan.innerText = up.count;
                
                if (gameData.commits >= up.cost) {
                    btn.disabled = false;
                } else {
                    btn.disabled = true;
                }
            }
        }

        // Spiel beim Start direkt laden
        loadGame();
        updateDisplay();

        // Game-Loop (30 FPS)
        let lastUpdate = Date.now();
        setInterval(() => {
            let now = Date.now();
            let delta = (now - lastUpdate) / 1000;
            lastUpdate = now;

            if (gameData.cps > 0) {
                gameData.commits += gameData.cps * delta;
                updateDisplay();
            }
        }, 33);

        // Automatisches Speichern alle 5 Sekunden
        setInterval(saveGame, 5000);

        // Speichern, wenn der Tab geschlossen oder die Seite verlassen wird
        window.addEventListener('beforeunload', saveGame);
    </script>
</body>
</html>
